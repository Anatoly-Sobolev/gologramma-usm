<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Голограмма — User Story Map</title>
<meta name="description" content="Карта пользовательских историй проекта «Голограмма» со статусом реализации.">
<style>
:root{
  --bg:#f6f7f9;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e4e7ec;--line2:#d0d5dd;--soft:#f2f4f7;
  --week:#2f6fd6;--done:#2f9e63;--done-bg:#eef8f2;--part:#b9680c;--part-bg:#fff6e8;--doc:#6d4fc2;--doc-bg:#f4f0fd;--cond:#0b7f8c;--cond-bg:#ebf7f8;--none:#8a93a3;--block:#c0392f;--block-bg:#fdf0ee;
  --shadow:0 1px 2px rgba(16,24,40,.06);--r:10px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.lock{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--week);outline-offset:2px}
.app{max-width:1600px;margin:0 auto;padding:0 16px 24px}
.hd{height:56px;display:flex;align-items:center;gap:12px;position:relative}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand h1{margin:0;font-size:17px;font-weight:650}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:2px}
.seg button{border:0;background:none;border-radius:6px;padding:4px 10px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--soft);color:var(--text);font-weight:600}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:5px 12px;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn .n{display:inline-block;margin-left:4px;background:var(--text);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.btn .n[hidden]{display:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13px;color:var(--muted);padding:2px 0 10px}
.sum b{color:var(--text);font-weight:600}
.lg{display:inline-flex;flex-wrap:wrap;gap:4px 12px}
.lg span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--c)}
.k-done{--c:var(--done);--b:var(--done-bg)}.k-part{--c:var(--part);--b:var(--part-bg)}.k-doc{--c:var(--doc);--b:var(--doc-bg)}.k-cond{--c:var(--cond);--b:var(--cond-bg)}.k-none{--c:var(--none);--b:var(--card)}.k-block{--c:var(--block);--b:var(--block-bg)}
.k-part .dot{border-radius:2px}.k-doc .dot{border-radius:2px;transform:rotate(45deg)}.k-cond .dot{background:none;border:2px solid var(--c)}.k-none .dot{background:none;border:1.5px dashed var(--c)}.k-block .dot{border-radius:2px;background:linear-gradient(45deg,transparent 40%,var(--c) 40%,var(--c) 60%,transparent 60%),linear-gradient(-45deg,transparent 40%,var(--c) 40%,var(--c) 60%,transparent 60%)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 10px}
.chips[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:1px 4px 1px 10px;font-size:12px}
.chip button{border:0;background:none;width:18px;height:18px;border-radius:50%;line-height:1;color:var(--muted)}
.pop{position:absolute;top:52px;right:0;z-index:20;width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(16,24,40,.12);padding:14px}
.pop[hidden]{display:none}
.pop label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px}
.pop select,.pop input{display:block;width:100%;margin-top:4px;padding:6px 8px;border:1px solid var(--line2);border-radius:6px;background:var(--card)}
.pop .row{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.board{display:grid;grid-template-columns:repeat(var(--n),minmax(150px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{min-width:0}
.ch{width:100%;text-align:left;border:0;background:none;padding:0 2px 8px;display:block}
.ch .top{display:flex;align-items:center;gap:6px}
.num{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:0 5px;background:var(--card)}
.nm{font-weight:600;font-size:13.5px;flex:1;min-width:0}
.ct{font-size:12px;color:var(--muted)}
.pg{display:flex;height:3px;border-radius:2px;background:var(--line);margin-top:7px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--done)}.pg i.p{background:var(--part);opacity:.55}
.cl{display:grid;gap:8px}
.card{display:flex;flex-direction:column;width:100%;min-height:74px;text-align:left;background:var(--b);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow)}
.card:hover{border-color:var(--line2);border-left-color:var(--c);box-shadow:0 2px 6px rgba(16,24,40,.08)}
.card.week{box-shadow:0 0 0 2px rgba(47,111,214,.18),var(--shadow)}
.week-badge{display:inline-flex;align-items:center;border-radius:999px;background:#eaf1ff;color:var(--week);font-size:10.5px;font-weight:650;line-height:1.4;padding:1px 6px;margin-left:5px;white-space:nowrap}
.r1{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;min-width:0;font-size:11.5px}
.id{flex:none;font-weight:600;color:var(--muted)}
.st{display:inline-flex;align-items:flex-start;justify-content:flex-end;gap:4px;min-width:0;max-width:70%;color:var(--muted);text-align:right;line-height:1.2;white-space:normal;overflow-wrap:anywhere}
.k-done .st{color:var(--done)}.k-part .st{color:var(--part)}.k-doc .st{color:var(--doc)}.k-cond .st{color:var(--cond)}.k-block .st{color:var(--block)}
.t{margin-top:3px;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sp{margin-top:auto;padding-top:3px;font-size:11px;color:var(--muted)}
.gl{font-size:11px;color:var(--muted);margin:12px 0 6px}
.mini-wrap{display:flex;flex-wrap:wrap;gap:4px}
.mini{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:1px 7px;font-size:11.5px;color:var(--muted)}
.mini:hover{color:var(--text);border-color:var(--line2)}
.empty{font-size:12px;color:var(--muted)}
.cross{margin-top:18px}
.cross h2{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px}
.cross .cl{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.rolenote{font-size:12px;color:var(--muted)}
/* panel */
.ov{position:fixed;inset:0;background:rgba(16,24,40,.25);z-index:40}
.ov[hidden],.panel[hidden]{display:none}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(620px,100vw);background:#fff;z-index:50;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(16,24,40,.1)}
.ph{padding:16px 24px 12px;border-bottom:1px solid var(--line);flex:none}
.ph .r{display:flex;align-items:flex-start;gap:12px}
.ph h2{margin:0;font-size:18px;font-weight:650;flex:1;min-width:0}
.ph h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:2px}
.x{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:3px 10px;font-size:13px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.meta span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted);background:#fff}
.meta .s{color:var(--c);border-color:var(--c);background:var(--b)}
.pb{padding:4px 24px 32px;overflow-y:auto;flex:1;overscroll-behavior:contain}
.pb h3{font-size:13px;font-weight:600;margin:20px 0 6px}
.pb p{margin:0 0 6px}
.pb ul{margin:0;padding-left:18px}
.pb li{margin:3px 0}
details{margin-top:24px;border:1px solid var(--line);border-radius:8px}
summary{padding:10px 12px;cursor:pointer;font-weight:600;font-size:13px}
details>div{padding:0 12px 12px}
details h4{font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 6px}
.path{display:flex;align-items:flex-start;gap:8px;background:var(--soft);border-radius:6px;padding:5px 8px;margin:4px 0}
.path code{flex:1;min-width:0;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}
.cp{flex:none;border:1px solid var(--line2);background:#fff;border-radius:5px;font-size:11px;padding:1px 7px;color:var(--muted)}
.plain{font-size:13px;color:var(--text)}
@media (max-width:1100px){.board{grid-template-columns:repeat(var(--n),minmax(220px,1fr));scroll-snap-type:x mandatory}.col{scroll-snap-align:start}}
@media (max-width:720px){
  .hd{height:auto;flex-wrap:wrap;padding:10px 0 6px;gap:8px}
  .brand{width:100%}
  .board{display:block;overflow:visible}
  .col{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
  .ch{padding:12px 36px 10px 12px;position:relative}
  .ch::after{content:"+";position:absolute;right:14px;top:10px;color:var(--muted);font-size:16px}
  .col.open .ch::after{content:"−"}
  .sb{display:none;padding:0 12px 12px}
  .col.open .sb{display:block}
  .cross .cl{grid-template-columns:1fr}
  .panel{width:100vw;border-left:0}
  .ph{padding:14px 16px 10px}.pb{padding:4px 16px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="hd">
  <div class="brand"><h1>Голограмма</h1><span>User Story Map · обновлено 25.11.2026</span></div>

  </div>
</header>
<div class="sum"><span id="sumTxt"></span><span>Все 40 ранее незавершённых карточек сверены с master e441145 и проверками отдельной ветки feature/usm-participant-privacy. Остальные карточки сохраняют историю предыдущих приёмок. Решения владельца и ограничения проверки указаны в каждой карточке.</span>
  <span class="lg" id="lg"></span>
  <span class="rolenote" id="roleNote"></span></div>
<div class="chips" id="chips" hidden></div>
<main><div class="board" id="board"></div><section class="cross" id="cross"></section></main>
</div>
<div class="ov" id="ov" hidden></div>
<aside class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="pT"></aside>

var PLAIN = {"ИС-01":["Клиент опубликован с настроенным HTTPS API; рабочую публикацию подтвердил владелец проекта. Актуальный develop описывает Web и Android клиент.","Держать адрес публикации и результаты проверки в документации проекта."],"ИС-02":["Участник открывает заставку из «О проекте и помощь» в орбитальном меню. Кнопка появляется при настройке видео и субтитров.","Утвердить заставку, права и WebVTT. Проверить воспроизведение на целевых устройствах."],"ИС-03":["Заставку можно пропустить, включая загрузку и ошибку. Орбитальный экран доступен сразу.","Проверить пропуск утверждённой заставки при включённой и отключённой анимации."],"ИС-04":["В орбитальном меню есть доступный гостю раздел с подсказкой, как читать истории и начать свою запись. Реплику можно заменить в конфигурации.","Утвердить образ, реплику, голос и права на материалы проводника."],"ИС-05":["Введение открывается по настроенным видео и WebVTT. При отсутствии материалов показано сообщение, путь участника открыт.","Предоставить финальные файлы и проверить воспроизведение и досмотр с ними."],"ИС-06":["В плеере есть пауза, перемотка, переключение субтитров, полноэкранный режим и пропуск. Элементы управления снабжены подписями.","Проверить тайминг WebVTT, полноэкранный режим, клавиатуру и TalkBack на согласованных медиа."],"ИС-07":["Перед вводом истории приложение показывает заданные владельцем условия. Без текста условий запись закрыта. Личную и публичную историю можно выбрать раздельно. В режиме разработки разрешена личная тестовая история без юридических условий. Публикация закрыта.","Утвердить содержание условий для обеих видимостей, удаления, исследования и резервных копий."],"ИС-08":["Участник явно принимает условия или выходит. До согласия редактор не открывает микрофон и поле истории. С историей доступны версия, время принятия и время регистрации согласия сервером. Без опубликованных условий личный тест запускается отдельной кнопкой. Для исследовательского сценария требуется согласие.","При выпуске опубликовать утверждённую редакцию условий по ИС-07."],"ИС-09":["Настраиваемая памятка отображается до записи рядом с условиями.","Передать памятку, проверить её читаемость и понимание участниками пилота."],"ИС-10":["У участника есть действия «Согласиться и начать историю» и «Отказаться и выйти». Повторная история снова начинается с выбора.","Приёмка формулировок владельцем в составе пилота."],"ИС-11":["Раздел помощи показывает утверждённую ссылку при её настройке, иначе сообщает об отсутствии опубликованных контактов. Раздел доступен до записи.","Владельцу утвердить контакты, назначение, географию, ответственного и адрес страницы. Проверить переход в целевой браузер."],"ИС-12":["Приложение объясняет, зачем нужен микрофон, и сообщает, если доступ не дали. Есть тесты.","Подсказать, как включить доступ, и проверить на телефонах."],"ИС-13":["Предел 10 минут из Р-24 виден в редакторе и применяется таймером. Полную длительность ещё нужно проверить реальной записью.","Проверить на устройствах и подтвердить минимальную длину записи (в коде 2 секунды)."],"ИС-14":["После успешной расшифровки локальный файл и браузерная копия очищаются. Для редактирования восстанавливаются версии текста.","Проверить на устройствах."],"ИС-15":["Распознавание использует локальный движок Android или браузера. После сохранения расшифровки клиент очищает аудио. При недоступной модели остаётся ручной ввод. Android включает русскую модель Vosk. Успешная расшифровка удаляет файл. Ручной ввод доступен при ошибке.","Проверить естественную речь пользователя, десятиминутную запись, прерывания и качество в целевых браузерах."],"ИС-16":["Исправления меняют редактируемый текст. Исходная машинная версия сохраняется отдельно и доступна уполномоченному исследователю. На Samsung участник может исправить полученный от локальной модели текст до отправки.","Качество реального распознавания принимается в ИС-15."],"ИС-17":["Участник подтверждает итоговый текст перед сохранением. Сервер хранит обе версии раздельно, а при ручном вводе машинная версия отсутствует. Подтверждённый текст личной тестовой истории сохранён в облачном архиве.","Владельцу принять сценарий с утверждёнными условиями для пилота."],"ИС-18":["В проверке браузерного клиента остановили API во время отправки, сохранили черновик, повторили отправку и получили ровно одну историю; рабочий сквозной путь подтверждён владельцем проекта. Личная тестовая история сохраняется в Amvera и открывается после повторного входа.","Зафиксировать результаты проверки на целевых Android и Web устройствах."],"ИС-19":["После квитанции сервера появляется собственная звезда. Для публичной истории показано ожидание модерации. После публикации история доступна из общего неба. В режиме разработки история остаётся в личном небе.","Проверить восприятие перехода к общему небу с участниками пилота."],"ИС-20":["После сохранения есть благодарность, материалы, новое согласие для следующей записи и завершение.","Утвердить итоговую реплику и принять сценарий пилота."],"ИС-21":["Из благодарности участник открывает альманах с подборкой до четырёх материалов владельца. Для каждого материала отображаются название и переход к ресурсу.","Подобрать 3–4 материала по теме, согласовать права и проверить полноту тематической подборки."],"ИС-22":["Кнопка делится только настроенной ссылкой на проект. Android открывает системный выбор приложения. В браузере без Web Share доступна выделяемая ссылка.","Утвердить постоянный публичный адрес и проверить нативное меню на поддерживаемом мобильном браузере."],"ИС-23":["«Завершить» останавливает локальное воспроизведение, сохраняет состояние и возвращает на предыдущий экран.","Утвердить текст и принять спокойное завершение с участниками пилота."],"ИС-24":["Звук, вибрация, анимация и субтитры переключаются по отдельности. Выбор восстанавливается из локального хранилища.","Проверить вибромотор, слышимость, субтитры и доступность с людьми на физических устройствах."],"ИС-25":["В актуальном проекте собираются Web и Android клиенты; владелец проекта подтвердил сквозную проверку обеих платформ.","Сохранить матрицу целевых устройств и результаты повторной регрессии."],"ИС-26":["Сообщение «Голограмма не является медицинским сервисом» видно при согласии и в разделе «О проекте и помощь».","Утвердить формулировку вместе с условиями и контактами."],"ИС-27":["При повторе отправляется сохранённый текст с тем же ключом. Запись остаётся на устройстве до расшифровки или удаления.","Повторять проверку после существенных изменений записи и отправки."],"ИС-28":["Удаление автором очищает историю и связанные данные. Повтор старой отправки не восстанавливает текст. Звуковой файл после расшифровки очищается на устройстве.","Отдельно согласовать сроки резервных копий и проверить прежнее хранилище по ИС-54 и ИС-55."],"ИС-30":["Настроенную аудиореплику проводника можно запустить по кнопке. Переключатель звука управляет воспроизведением.","Утвердить диктора, права, реплики и записи. Проверить реальное воспроизведение."],"ИС-31":["Редактор поддерживает до трёх необязательных вопросов из конфигурации. Сервер проверяет актуальность вопросов и сохраняет ответы в закрытой исследовательской записи.","Утвердить методику, вопросы, основание обработки и принять их отображение."],"ИС-32":["В редакторе доступен ручной ввод текста независимо от результата распознавания.","Проверить сценарий с отказом сервиса распознавания на устройствах."],"ИС-33":["В разделе помощи предусмотрены раскрываемые утверждённые пары «вопрос — ответ». Пустой набор скрыт.","Решение В-02 и утверждённый набор вопросов и ответов."],"ИС-34":["Раздел показывает внешнюю ссылку поддержки при наличии настроенного HTTPS-адреса.","Утвердить юридическую схему, сервис, адрес и проверить внешний переход."],"ИС-40":["Именное приветствие исключено из анонимного сценария.","Новое решение владельца о персонализации."],"ИС-41":["Редактор может сохранить согласованный английский перевод опубликованной истории. Участник открывает перевод в карточке.","Получит   var s=DATA[i]; last=document.activeElement;
  var files=paths(s.why.join(" ")), tests=paths(s.tests), cm=commits(s);
  var h='<div class="ph k-'+s.k+'"><div class="r"><h2 id="pT"><small>'+esc(s.id)+'</small>'+esc(SHORT[s.id])+'</h2><button type="button" class="x" id="pX">Закрыть</button></div>'+
    '<div class="meta"><span class="s">'+K[s.k]+'</span><span>'+esc(s.role)+'</span><span>'+(s.spr.length?"Спринт "+esc(s.spr.join(", ")):"Вне плана")+'</span><span>'+esc(s.prio)+'</span></div></div>'+
    '<div class="pb"><h3>Что требовалось</h3><p>'+esc(s.t)+'.</p>'+
    '<h3>Что фактически сделано</h3><p>'+esc(PLAIN[s.id][0])+'</p>'+
    '<h3>Что осталось сделать</h3><p>'+esc(PLAIN[s.id][1])+'</p>'+
    '<h3>Почему такой статус</h3><p>'+esc(why(s))+'</p>'+
    '<details><summary>Технические подтверждения</summary><div>'+
    '<h4>Подробное обоснование</h4><ul>'+s.why.map(function(x){return '<li class="plain">'+esc(short(x))+'</li>'}).join("")+'</ul>'+
    (files.length?'<h4>Файлы</h4>'+files.map(pathRow).join(""):'')+
    '<h4>Тесты</h4>'+(tests.length?tests.map(pathRow).join("")+'<p class="plain">'+esc(short(s.tests))+'</p>':'<p class="plain">'+esc(s.tests)+'</p>')+
    '<h4>Коммиты</h4>'+(cm.length?'<ul>'+cm.map(commitRow).join("")+'</ul>':'<p class="plain">—</p>')+
    '<h4>Требования и экраны</h4><p class="plain">'+esc(s.req+" · "+s.scr)+'</p>'+
    '<h4>Ветка</h4><p class="plain">'+esc(s.branch)+'</p>'+
    (s.deps?'<h4>Зависимости и вопросы</h4><p class="plain">'+esc(s.deps)+'</p>':'')+'</div></details></div>';
  var p=$("panel"); p.innerHTML=h; p.hidden=false; $("ov").hidden=false; document.body.classList.add("lock"); $("pX").focus();}
function closePanel(){ if($("panel").hidden) return false; $("panel").hidden=true; $("ov").hidden=true; document.body.classList.remove("lock"); if(last&&document.contains(last)) last.focus(); return true;}
function copy(t,btn){
  function done(){btn.textContent="Скопировано";setTimeout(function(){btn.textContent="Копировать"},1200)}
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,fb);return;} }catch(e){}
  fb();
  function fb(){try{var a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done();}catch(e){btn.textContent="Не удалось";}}
}
function pop(open){$("pFilt").hidden=!open;$("bFilt").setAttribute("aria-expanded",open?"true":"false")}
document.addEventListener("click",function(e){var t=e.target,c;
  if((c=t.closest("[data-copy]"))){copy(c.getAttribute("data-copy"),c);return;}
  if((c=t.closest(".card,.mini"))){openStory(+c.getAttribute("data-i"));return;}
  if((c=t.closest(".ch"))){ if(mq.matches){var k=c.getAttribute("data-stage");state.open[k]=!state.open[k];render();var n=document.querySelector('.ch[data-stage="'+k+'"]');if(n)n.focus();} return;}
  if((c=t.closest("#roles button"))){state.role=c.getAttribute("data-role");state.f.stage="";render();return;}
  if((c=t.closest("[data-clear]"))){state.f[c.getAttribute("data-clear")]="";sync();render();return;}
  if(t.closest("#bFilt")){pop($("pFilt").hidden);return;}
  if(t.closest("#fClose")){pop(false);$("bFilt").focus();return;}
  if(t.closest("#fReset")){state.f={stage:"",spr:"",st:"",q:""};sync();render();return;}
  if(t===$("ov")||t.closest("#pX")){closePanel();return;}
  if(!t.closest(".pop")) pop(false);
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){ if(!closePanel()&&!$("pFilt").hidden){pop(false);$("bFilt").focus();} }});
function sync(){$("fSpr").value=state.f.spr;$("fSt").value=state.f.st;$("fQ").value=state.f.q;}
$("fRole").innerHTML=ROLES.map(function(r){return '<option>'+r+'</option>'}).join("");
$("roles").innerHTML=ROLES.map(function(r){return '<button type="button" data-role="'+r+'">'+r+'</button>'}).join("");
$("fRole").addEventListener("input",function(){state.role=this.value;state.f.stage="";render()});
$("fStage").addEventListener("input",function(){state.f.stage=this.value;render()});
$("fSpr").addEventListener("input",function(){state.f.spr=this.value;render()});
$("fSt").addEventListener("input",function(){state.f.st=this.value;render()});
$("fQ").addEventListener("input",function(){state.f.q=this.value;render()});
META.service.forEach(function(g){state.open[g[0]]=true});
if(mq.addEventListener) mq.addEventListener("change",render);
render();
</script>
</body>
</html>
